name: Mutation testing

# Mutation testing (gremlins) is the objective check for "fake" tests: it mutates the
# source and a surviving (LIVED) mutant means no test caught the change. It is SLOW, so it
# runs nightly / on demand and scoped per package — never per-commit. It is informational:
# no thresholds are set, so it reports survivors as artifacts without failing the build.
#
# sub and service are too big to mutate whole in one job (until 26.11.2026 they ran out of
# time or took the runner down every night, so they never produced a report). They are covered
# by the "changed" job instead: only code changed on main since the previous day, from the repo
# root (gremlins v0.6.0 finds no mutants when --diff is combined with a package path), skipped
# with a notice when one day brings more than CHANGED_LIMIT mutants (an upstream sync).
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gremlins:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: changed
            path: ""
            exclude: 'internal/web/service/(server|xray|inbound|client_bulk|inbound_traffic)\.go|_postgres_test\.go'
          - name: runtime
            path: ./internal/web/runtime/
            exclude: ""
          - name: link
            path: ./internal/util/link/
            exclude: ""
          - name: database
            path: ./internal/database/
            exclude: 'dump_sqlite\.go|dbtest/' # dbtest is a test helper, not product code
            postgres: postgres:16
    # The PostgreSQL-only code is covered only with a server; each test takes its own schema
    # (pgSchemaDSN), so gremlins' parallel test runs never share tables. An empty image skips it.
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xui_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xui_scratch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XUI_TEST_PG_DSN: ${{ matrix.postgres && 'host=127.0.0.1 port=5432 user=postgres password=postgres dbname=xui_scratch sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the "changed" job diffs against yesterday's main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Run gremlins on ${{ matrix.name }}
        run: |
          OUT="mutation-${{ matrix.name }}.json"
          set --
          if [ -n "${{ matrix.exclude }}" ]; then set -- -E '${{ matrix.exclude }}'; fi
          if [ "${{ matrix.name }}" = changed ]; then
            CHANGED_LIMIT=600
            base=$(git rev-list -1 --first-parent --before="1 day ago" HEAD)
            if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
              echo "No new commits on main since yesterday: nothing to mutate."; exit 0
            fi
            set -- "$@" --diff "$base"
            n=$(gremlins unleash --dry-run "$@" | sed -n 's/^Runnable: \([0-9]*\).*/\1/p')
            echo "Code changed since $base gives ${n:-0} mutants."
            if [ "${n:-0}" -gt "$CHANGED_LIMIT" ]; then
              echo "::notice::Skipped: ${n} mutants is more than ${CHANGED_LIMIT} (an upstream sync?); the next days cover new changes."
              exit 0
            fi
          fi
          gremlins unleash "$@" -o "$OUT" ${{ matrix.path }}
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.name }}
          path: mutation-${{ matrix.name }}.json
          if-no-files-found: ignore
